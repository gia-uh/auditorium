<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<main class="aud" data-format="short">
  <section data-beat="hook" data-d="4.5">
    <h1 id="first-title">First</h1>
    <p id="late" data-in="2" data-enter="fade">Enters at two seconds</p>
    <p id="brief" data-in="1" data-out="3.5">Leaves at three and a half</p>
  </section>
  <section data-beat="second" data-d="3">
    <h1 id="second-title">Second</h1>
    <audio src="assets/bed.wav" data-in="0.5" data-gain="0.5" data-duck></audio>
  </section>
</main>
</body>
</html>
