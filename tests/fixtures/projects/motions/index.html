<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<!-- One timed beat that exercises every motion attribute. Times in the tests
     are milliseconds from 0, the beat's start. -->
<main class="aud" data-format="explainer">
  <section data-beat="m" data-d="4">
    <div class="grid">
      <p id="exiting" data-col="1/4" data-out="2" data-exit="fade">leaves at 2 s</p>
      <p id="idler" data-col="4/7" data-idle="float">floats</p>
      <p id="rise-float" data-col="7/10" data-enter="rise" data-idle="float">rises and floats</p>
      <p id="words" data-col="10/13" data-enter="words">one two three four</p>
      <div data-col="1/4" data-enter="count"><b id="count-int" data-to="200">0</b></div>
      <div data-col="4/7" data-enter="count"><b id="count-dec" data-to="0.01">0</b></div>
      <p id="slow" data-col="7/10" data-enter="fade" data-dur="2" data-ease="linear">slow and linear</p>
      <p id="quick" data-col="10/13" data-enter="fade">default fade</p>
      <div id="cell" data-col="4/7" data-row="4">cell</div>
      <p id="cued" data-col="7/13" data-cue="hello">cued</p>
      <svg data-col="1/4" viewBox="0 0 100 100" width="100" height="100">
        <path id="drawn" data-enter="draw" d="M 0 0 L 100 100" fill="none" stroke="black"/>
      </svg>
    </div>
  </section>
</main>
</body>
</html>
