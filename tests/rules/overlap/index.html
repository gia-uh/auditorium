<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixture: overlap</title>
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<main class="aud" data-format="deck">
  <section data-beat="clean" class="title">
    <h1>A clean beat</h1>
  </section>
  <section data-beat="broken">
    <div style="position: relative; height: 300px; width: 900px">
      <p style="position: absolute; top: 0; left: 0">The first line of text</p>
      <p style="position: absolute; top: 10px; left: 40px">A second line on top of it</p>
    </div>
  </section>
</main>
</body>
</html>
