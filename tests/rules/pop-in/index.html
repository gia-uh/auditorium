<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixture: pop-in</title>
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<main class="aud" data-format="deck">
  <section data-beat="clean" class="title">
    <h1 data-enter="fade">A clean entrance</h1>
  </section>
  <section data-beat="broken" class="title">
    <h1 data-enter="fade" style="opacity: 1 !important">An entrance that pops in</h1>
  </section>
</main>
</body>
</html>
