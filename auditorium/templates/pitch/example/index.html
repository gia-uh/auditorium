<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar for every school</title>
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <link rel="stylesheet" href="theme.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<main class="aud" data-format="deck">
  <img class="brand" src="assets/logo.svg" alt="Solar cooperative">

  <section data-beat="title" class="title">
    <span class="kicker">Solar cooperative, 2027 plan</span>
    <h1 data-enter="words">Solar for every school</h1>
    <p data-in="0.8" data-enter="fade">Rooftop power that pays for itself in four years</p>
  </section>

  <section data-beat="problem" class="statement">
    <p data-enter="words">Schools lose class hours to <em>every blackout</em>.</p>
  </section>

  <section data-beat="numbers" class="stats">
    <h2>What we have built so far</h2>
    <div class="stat" data-enter="count"><b data-to="42">0</b><span>schools on solar</span></div>
    <div class="stat" data-in="0.3" data-enter="count"><b data-to="1.8">0</b><span>MW installed</span></div>
    <div class="stat" data-in="0.6" data-enter="count"><b data-to="96">0</b><span>% fewer lost hours</span></div>
  </section>

  <section data-beat="photo" class="photo">
    <figure>
      <div class="frame"><img src="assets/photo.svg" alt="Panels on a school roof under a clear sky"></div>
      <figcaption>Three rows of panels on a school roof</figcaption>
    </figure>
  </section>

  <section data-beat="partners" class="logos">
    <h2>Who works with us</h2>
    <img class="logo" src="assets/partner-1.svg" alt="Coastal">
    <img class="logo" src="assets/partner-2.svg" alt="Harbour">
    <img class="logo" src="assets/partner-3.svg" alt="Valley">
  </section>

  <section data-beat="ask" class="title">
    <h1 data-enter="words">Fund the next 50 schools</h1>
    <p data-in="0.8" data-enter="fade">schools@solar.example.org</p>
  </section>

</main>
</body>
</html>
