<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk sales, 2026</title>
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <link rel="stylesheet" href="theme.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<main class="aud" data-format="page">
  <img class="brand" src="assets/logo.svg" alt="Kiosk cooperative">

  <section data-beat="title" class="title">
    <span class="kicker">Kiosk cooperative, 2026</span>
    <h1>Sales by region</h1>
    <div class="chips" id="chips">
      <button type="button" data-group="all" aria-pressed="true">Year</button>
      <button type="button" data-group="Q1" aria-pressed="false">Q1</button>
      <button type="button" data-group="Q2" aria-pressed="false">Q2</button>
      <button type="button" data-group="Q3" aria-pressed="false">Q3</button>
      <button type="button" data-group="Q4" aria-pressed="false">Q4</button>
    </div>
  </section>

  <section data-beat="kpis" class="stats">
    <div class="stat"><b id="kpi-value">0</b><span>sales, in pesos</span></div>
    <div class="stat"><b id="kpi-count">0</b><span>orders</span></div>
    <div class="stat"><b id="kpi-ratio">0</b><span>pesos per order</span></div>
  </section>

  <section data-beat="chart" class="chart">
    <h2>Sales by region</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section data-beat="table" class="table">
    <h2>Every region</h2>
    <table>
      <thead><tr><th>region</th><th>sales</th><th>orders</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
