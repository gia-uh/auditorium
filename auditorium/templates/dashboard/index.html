<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard title</title>
  <link rel="stylesheet" href="/_auditorium/auditorium.css">
  <link rel="stylesheet" href="theme.css">
  <script type="module" src="/_auditorium/auditorium.js"></script>
</head>
<body>
<!-- A dashboard: a page of three key numbers, a bar chart and a table, with
     chips that filter them. script.js draws them from the rows in
     <script id="data"> below, then from the endpoint in auditorium.toml when
     it answers. Replace every element marked data-placeholder, then delete
     the attribute; put your rows in <script id="data"> and in the fixture
     assets/sales.json, one chip per group. -->
<main class="aud" data-format="page">
  <!-- The logo slot: at the top of the page. Replace assets/logo.svg with
       your logo, or delete both. -->
  <img class="brand" src="assets/logo.svg" alt="Logo" data-placeholder>

  <section data-beat="title" class="title">
    <span class="kicker" data-placeholder>Team, period</span>
    <h1 data-placeholder>What the dashboard tracks</h1>
    <!-- One button per group in the data; data-group is the row's "group". -->
    <div class="chips" id="chips">
      <button type="button" data-group="all" aria-pressed="true" data-placeholder>All</button>
      <button type="button" data-group="Q1" aria-pressed="false" data-placeholder>Q1</button>
      <button type="button" data-group="Q2" aria-pressed="false" data-placeholder>Q2</button>
    </div>
  </section>

  <!-- KPI tiles: the sum of value, the sum of count, and value per count. -->
  <section data-beat="kpis" class="stats">
    <div class="stat"><b id="kpi-value">0</b><span data-placeholder>total value</span></div>
    <div class="stat"><b id="kpi-count">0</b><span data-placeholder>total count</span></div>
    <div class="stat"><b id="kpi-ratio">0</b><span data-placeholder>value per count</span></div>
  </section>

  <section data-beat="chart" class="chart">
    <h2 data-placeholder>Value by label</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section data-beat="table" class="table">
    <h2 data-placeholder>Every label</h2>
    <table>
      <thead><tr><th data-placeholder>label</th><th data-placeholder>value</th><th data-placeholder>count</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

</main>
<script type="application/json" id="data">
[
  {"group": "Q1", "label": "First", "value": 100, "count": 10},
  {"group": "Q1", "label": "Second", "value": 60, "count": 8},
  {"group": "Q2", "label": "First", "value": 120, "count": 12},
  {"group": "Q2", "label": "Second", "value": 80, "count": 9}
]
</script>
<script src="script.js"></script>
</body>
</html>
