<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditorium – Presenter</title>
    <link rel="stylesheet" href="/_auditorium/presenter.css">
</head>
<body class="aud-presenter">
    <div id="presenter-container">
        <!-- Left: the project's own page, embedded and driven, not a copy of
             the audience's DOM. Two engines seeking one page agree by
             construction (D2); a mirror is a second path that can disagree. -->
        <div id="slide-pane">
            <iframe id="stage-frame" src="/?embed" title="stage"></iframe>
        </div>

        <div id="info-pane">
            <div id="notes">No notes.</div>

            <div id="next-preview">
                <div id="next-title">Next: —</div>
                <div id="next-excerpt"></div>
            </div>

            <div id="presenter-footer">
                <span id="presenter-timer">00:00</span>
                <span id="slide-indicator"></span>
            </div>
        </div>
    </div>

    <div id="connection-status"></div>

    <script type="module">
    import { connect } from "/_auditorium/client.js";

    const frame = document.getElementById('stage-frame');
    const pane = document.getElementById('slide-pane');
    const indicator = document.getElementById('slide-indicator');
    const statusEl = document.getElementById('connection-status');
    const notesEl = document.getElementById('notes');
    const nextTitleEl = document.getElementById('next-title');
    const nextExcerptEl = document.getElementById('next-excerpt');
    const timerEl = document.getElementById('presenter-timer');

    let timerStart = null;
    let socket = null;
    let aud = null;
    let player = null;

    /** Plain text of author-written HTML, for the next-beat excerpt.
     *  Via textContent, never a regex: notes are real markup. */
    function excerptOf(html, limit = 200) {
        const box = document.createElement('div');
        box.innerHTML = html || '';
        const text = box.textContent.trim().replace(/\s+/g, ' ');
        return text.length > limit ? text.slice(0, limit) + '…' : text;
    }

    function onFrame(p) {
        const t = p.t;
        indicator.textContent = (p.beatIndex(t) + 1) + ' / ' + p.beats.length;
        const here = p.markerAt(t);
        notesEl.innerHTML = here && here.notes_html && here.notes_html.trim()
            ? here.notes_html : 'No notes.';
        const next = p.markerAfter(t);
        if (next) {
            nextTitleEl.textContent = 'Next: ' + next.title;
            nextExcerptEl.textContent = excerptOf(next.notes_html);
        } else {
            nextTitleEl.textContent = 'Last beat';
            nextExcerptEl.textContent = '';
        }
    }

    function fitStage() {
        const { w, h } = (aud && aud.stage) || { w: 1440, h: 900 };
        const scale = Math.min(pane.clientWidth / w, pane.clientHeight / h);
        const dx = (pane.clientWidth - w * scale) / 2;
        const dy = (pane.clientHeight - h * scale) / 2;
        frame.style.width = w + 'px';
        frame.style.height = h + 'px';
        frame.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
    }

    function startTimer() {
        if (timerStart !== null) return;
        timerStart = Date.now();
        setInterval(function () {
            const elapsed = Math.floor((Date.now() - timerStart) / 1000);
            const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const ss = String(elapsed % 60).padStart(2, '0');
            timerEl.textContent = mm + ':' + ss;
        }, 1000);
    }

    function send(cmd) {
        if (socket) socket.send(Object.assign({ type: 'cmd' }, cmd));
    }

    // Act locally, then broadcast the same intent. The audience runs the same
    // engine over the same page, so a command is enough -- there is no need
    // to stream 60 positions a second, and nothing to drift.
    function next() {
        startTimer();
        const from = player.t;
        const to = player.nextBeat(from);
        if (player.playing) { player.seekTo(to); send({ cmd: 'seek', t: to }); }
        else { player.playTo(to); send({ cmd: 'playTo', from, to }); }
    }

    function prev() {
        startTimer();
        const to = player.prevBeat(player.t);
        player.seekTo(to);
        send({ cmd: 'seek', t: to });
    }

    function seekTo(t) {
        player.seekTo(t);
        send({ cmd: 'seek', t });
    }

    function onKey(e) {
        if (!player) return;
        switch (e.key) {
            case ' ': case 'ArrowRight': case 'PageDown':
                e.preventDefault(); next(); break;
            case 'ArrowLeft': case 'PageUp':
                e.preventDefault(); prev(); break;
            case 'r': e.preventDefault(); seekTo(0); break;
            case 'End': e.preventDefault(); seekTo(player.duration); break;
        }
    }

    function attach() {
        return new Promise((resolve) => {
            const poll = () => {
                const w = frame.contentWindow;
                if (w && w.auditorium && w.auditorium.built) {
                    aud = w.auditorium;
                    player = aud.player;
                    aud.onFrame(onFrame);
                    w.document.addEventListener('keydown', onKey);
                    resolve();
                } else {
                    requestAnimationFrame(poll);
                }
            };
            poll();
        });
    }

    async function setup(held) {
        await attach();
        fitStage();
        player.seekTo(Math.min(held, player.duration));
    }

    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', fitStage);

    window.__auditorium_presenter = {
        ready: false,
        next, prev, seekTo,
        state: () => ({
            t: player.t,
            timerRunning: timerStart !== null,
            notes: notesEl.innerHTML,
        }),
    };

    socket = connect({
        role: 'presenter',
        onStatus(state) {
            statusEl.innerHTML = '<span class="aud-dot aud-dot-' + state + '"></span>';
        },
        async onReload() {
            const held = player ? player.t : 0;
            aud = player = null;
            frame.contentWindow.location.reload();
            await new Promise((r) => frame.addEventListener('load', r, { once: true }));
            await setup(held);
        },
    });

    setup(0).then(() => { window.__auditorium_presenter.ready = true; });
    </script>
</body>
</html>
