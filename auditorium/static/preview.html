<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditorium – Preview</title>
    <link rel="stylesheet" href="/_auditorium/preview.css">
</head>
<body class="aud-preview">
    <div id="preview-viewport">
        <!-- The project's own page, embedded: one engine, the author's file,
             no copy of either. Fixed logical size, scaled by transform, so the
             author sees the layout the renderer produces. -->
        <iframe id="stage-frame" src="/?embed" title="stage"></iframe>
    </div>

    <div id="preview-bar">
        <button id="playpause" title="Play / pause (space)">▶</button>
        <div id="scrub-wrap">
            <input type="range" id="scrub" min="0" max="0" step="1" value="0">
            <div id="beat-ticks"></div>
            <div id="loop-band"></div>
        </div>
        <span id="time-readout" class="readout">00:00.000 / 00:00.000</span>
        <span id="frame-readout" class="readout">frame 0 / 0</span>
        <span id="loop-readout" class="readout readout-dim">loop off</span>
        <span id="connection-status"></span>
    </div>

    <script type="module">
    import { connect, formatTime } from "/_auditorium/client.js";

    const frame = document.getElementById('stage-frame');
    const viewport = document.getElementById('preview-viewport');
    const scrub = document.getElementById('scrub');
    const ticks = document.getElementById('beat-ticks');
    const band = document.getElementById('loop-band');
    const timeReadout = document.getElementById('time-readout');
    const frameReadout = document.getElementById('frame-readout');
    const loopReadout = document.getElementById('loop-readout');
    const playpause = document.getElementById('playpause');
    const statusEl = document.getElementById('connection-status');

    const loop = { in: 0, out: 0, enabled: false };
    let loops = 0;      // completed wraps, for tests and for the readout
    let reloads = 0;
    let aud = null;     // the page's window.auditorium
    let player = null;  // its player: playback, beats, render frame numbers

    // Stepping works in TIMELINE frames: they are what seek(t) addresses, and
    // the index is authoritative with time derived from it, so stepping
    // forward N times lands exactly where seeking to frame N does.
    //
    // The readout instead reports RENDER frames, which additionally count the
    // dwell a render spends on each stop of a presented deck. Reporting
    // timeline frames there would tell an author "frame 137 / 302" about a
    // deck that renders to 2821 -- and 302 is not a number --from/--to can use.
    const frameOf = (t) => Math.round(t * player.fps / 1000);
    const timeOf = (f) => Math.round(f * 1000 / player.fps);

    function onFrame(p) {
        const t = p.t;
        scrub.value = Math.round(t);
        timeReadout.textContent = formatTime(t) + ' / ' + formatTime(p.duration);
        frameReadout.textContent = 'frame ' + p.renderFrameOf(t) + ' / ' + p.renderFrameCount();
        playpause.textContent = p.playing ? '❚❚' : '▶';
    }

    function stageSize() {
        return (aud && aud.stage) || { w: 1440, h: 900 };
    }

    function fitStage() {
        const { w, h } = stageSize();
        const bar = document.getElementById('preview-bar').offsetHeight;
        const availW = window.innerWidth;
        const availH = window.innerHeight - bar;
        const scale = Math.min(availW / w, availH / h);
        // Translate before scale in the composite, so the offsets are in the
        // viewport's own pixels and the letterboxing is even on both sides.
        const dx = (availW - w * scale) / 2;
        const dy = (availH - h * scale) / 2;
        frame.style.width = w + 'px';
        frame.style.height = h + 'px';
        frame.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
        viewport.style.height = availH + 'px';
    }

    function drawTicks() {
        ticks.innerHTML = '';
        if (!player.duration) return;
        for (const b of player.beats) {
            const tick = document.createElement('div');
            tick.className = 'beat-tick';
            tick.style.left = (b / player.duration * 100) + '%';
            ticks.appendChild(tick);
        }
    }

    function drawLoopBand() {
        if (!loop.enabled || !player || !player.duration) {
            band.style.display = 'none';
            loopReadout.textContent = 'loop off';
            loopReadout.classList.add('readout-dim');
            return;
        }
        band.style.display = 'block';
        band.style.left = (loop.in / player.duration * 100) + '%';
        band.style.width = ((loop.out - loop.in) / player.duration * 100) + '%';
        loopReadout.textContent = 'loop ' + formatTime(loop.in) + '–' + formatTime(loop.out);
        loopReadout.classList.remove('readout-dim');
    }

    /** Play to the loop's out point and wrap, or to the end and stop.
     *
     * The wrap seeks backward, so the engine resets and replays (D5). That
     * is not a cost to work around -- it is why a loop shows exactly what a
     * renderer would produce for the range.
     */
    function play() {
        if (loop.enabled && loop.out > loop.in) {
            if (player.t < loop.in || player.t >= loop.out) player.seekTo(loop.in);
            player.playTo(loop.out, () => { loops += 1; player.seekTo(loop.in); play(); });
        } else {
            player.playTo(player.duration);
        }
    }

    function playPause() {
        if (player.playing) player.pause();
        else play();
        playpause.textContent = player.playing ? '❚❚' : '▶';
    }

    function stepFrames(delta) {
        player.pause();
        const f = Math.max(0, Math.min(frameOf(player.duration), frameOf(player.t) + delta));
        player.seekTo(timeOf(f));
    }

    /** Wait for the embedded page to build, then attach to it. */
    function attach() {
        return new Promise((resolve) => {
            const poll = () => {
                const w = frame.contentWindow;
                if (w && w.auditorium && w.auditorium.built) {
                    aud = w.auditorium;
                    player = aud.player;
                    aud.onFrame(onFrame);
                    // Keys pressed while the stage has focus belong to the preview.
                    w.document.addEventListener('keydown', onKey);
                    resolve();
                } else {
                    requestAnimationFrame(poll);
                }
            };
            poll();
        });
    }

    async function setup(held) {
        await attach();
        scrub.max = player.duration;
        drawTicks();
        drawLoopBand();
        fitStage();
        player.seekTo(Math.min(held, player.duration));
    }

    async function reload() {
        const held = player ? player.t : 0;
        if (player) player.pause();
        aud = player = null;
        frame.contentWindow.location.reload();
        // Hold t, not node identity. If the edit changed what exists at that
        // instant the author sees the new beat at the old time.
        await new Promise((r) => frame.addEventListener('load', r, { once: true }));
        await setup(held);
        reloads += 1;
    }

    function onKey(e) {
        if (!player) return;
        if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
        switch (e.key) {
            case ' ': e.preventDefault(); playPause(); break;
            case '.': e.preventDefault(); stepFrames(1); break;
            case ',': e.preventDefault(); stepFrames(-1); break;
            case 'ArrowRight': e.preventDefault(); player.seekTo(player.nextBeat(player.t)); break;
            case 'ArrowLeft': e.preventDefault(); player.seekTo(player.prevBeat(player.t)); break;
            case 'i': e.preventDefault(); loop.in = player.t; drawLoopBand(); break;
            case 'o': e.preventDefault(); loop.out = player.t; drawLoopBand(); break;
            case 'l': e.preventDefault(); loop.enabled = !loop.enabled; drawLoopBand(); break;
            case 'x': e.preventDefault(); loop.enabled = false; loop.in = loop.out = 0; drawLoopBand(); break;
            case 'Home': e.preventDefault(); player.seekTo(0); break;
            case 'End': e.preventDefault(); player.seekTo(player.duration); break;
        }
    }

    scrub.addEventListener('input', () => {
        player.pause();
        player.seekTo(Number(scrub.value));
    });
    playpause.addEventListener('click', playPause);
    window.addEventListener('resize', fitStage);
    document.addEventListener('keydown', onKey);

    window.__auditorium_preview = {
        ready: false,
        state: () => ({
            t: player.t,
            frame: frameOf(player.t),
            renderFrame: player.renderFrameOf(player.t),
            renderFrameCount: player.renderFrameCount(),
            playing: player.playing,
            loop: { in: loop.in, out: loop.out, enabled: loop.enabled },
            loops,
            reloads,
        }),
        setLoop(inMs, outMs) { loop.in = inMs; loop.out = outMs; drawLoopBand(); },
        toggleLoop() { loop.enabled = !loop.enabled; drawLoopBand(); },
        playPause,
        stepFrames,
        reload,
    };

    connect({
        role: 'audience',
        onStatus(state) {
            statusEl.innerHTML = '<span class="aud-dot aud-dot-' + state + '"></span>';
        },
        onReload: reload,
    });

    // Opens paused at zero. An authoring surface that starts playing fights
    // the author.
    setup(0).then(() => { window.__auditorium_preview.ready = true; });
    </script>
</body>
</html>
