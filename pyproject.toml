[project]
name = "auditorium"
version = "1!4.0.0"
description = "Present, preview and render decks, posters and videos written in HTML"
authors = [{name = "Alejandro Piad", email = "apiad@apiad.net"}]
license = {text = "MIT"}
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=15.0.0",
    "pyyaml>=6",
    "pillow>=11",
]

[project.scripts]
auditorium = "auditorium.cli:app"

[project.optional-dependencies]
record = [
    "playwright>=1.62",
    "pypdf>=5",
    "tqdm>=4.67.3",
]
# Music beds for auditorium music (#90). Euterpe itself is vendored in
# auditorium/_vendor/euterpe (#132): PyPI refuses a git dependency, and the PyPI
# project "euterpe" is unrelated. These are the libraries it needs at runtime.
music = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.13",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditorium"]

[tool.hatch.build.targets.sdist]
include = [
    "/auditorium",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "numpy>=2.0",
    "playwright>=1.62",
    "pypdf>=5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "scipy>=1.13",
    "soundfile>=0.13",
]
docs = [
    "scriptorium[pdf]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Vendored code is kept as upstream wrote it, so a refresh is a plain copy.
extend-exclude = ["auditorium/_vendor"]

[tool.uv.sources]
scriptorium = { git = "https://github.com/apiad/scriptorium", rev = "v0.14.0" }
